services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rnr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: rnr_rent_car
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - rnr_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnr -d rnr_rent_car"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rnr_database:
